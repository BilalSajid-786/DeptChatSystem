<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeptChat</title>
    <base href="/" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
</head>
<body>
    <div id="app">
        <div class="boot">
            <div class="boot-logo" aria-hidden="true"></div>
            <div>Loading DeptChat… <span class="boot-pct"></span></div>
            <!-- Filled by Blazor's loader (--blazor-load-percentage), so the first visit never looks stuck. -->
            <div class="boot-progress" role="progressbar" aria-label="Loading DeptChat"><div class="boot-progress-bar"></div></div>
            <div class="boot-hint">The first visit can take up to a minute on a slow connection.</div>
        </div>
    </div>

    <div id="blazor-error-ui" role="alert">
        Something went wrong. <a href="" class="reload">Reload</a>
        <button type="button" class="dismiss" aria-label="Dismiss">✕</button>
    </div>

    <script src="js/deptchat.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
